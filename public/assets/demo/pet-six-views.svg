<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <clipPath id="c0"><rect x="16" y="16" width="368" height="368" rx="24"/></clipPath>
    <clipPath id="c1"><rect x="416" y="16" width="368" height="368" rx="24"/></clipPath>
    <clipPath id="c2"><rect x="816" y="16" width="368" height="368" rx="24"/></clipPath>
    <clipPath id="c3"><rect x="16" y="416" width="368" height="368" rx="24"/></clipPath>
    <clipPath id="c4"><rect x="416" y="416" width="368" height="368" rx="24"/></clipPath>
    <clipPath id="c5"><rect x="816" y="416" width="368" height="368" rx="24"/></clipPath>
    <filter id="paper"><feColorMatrix type="matrix" values=".98 0 0 0 .02 0 .96 0 0 .02 0 0 .92 0 .03 0 0 0 1 0"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#fffdf9"/>
  <g fill="#f8f0e5">
    <rect x="16" y="16" width="368" height="368" rx="24"/><rect x="416" y="16" width="368" height="368" rx="24"/><rect x="816" y="16" width="368" height="368" rx="24"/>
    <rect x="16" y="416" width="368" height="368" rx="24"/><rect x="416" y="416" width="368" height="368" rx="24"/><rect x="816" y="416" width="368" height="368" rx="24"/>
  </g>
  <!-- The same supplied demo pet is framed into six distinct, named views. -->
  <g clip-path="url(#c0)"><image xlink:href="../postcard-a.png" x="28" y="28" width="344" height="300" preserveAspectRatio="xMidYMid slice" filter="url(#paper)"/></g>
  <g clip-path="url(#c1)"><image xlink:href="../postcard-a.png" x="448" y="28" width="304" height="300" preserveAspectRatio="xMidYMid slice" transform="translate(70 0) scale(-1 1)" filter="url(#paper)"/></g>
  <g clip-path="url(#c2)"><image xlink:href="../postcard-a.png" x="828" y="35" width="344" height="290" preserveAspectRatio="xMidYMid slice" opacity=".82" filter="url(#paper)"/></g>
  <g clip-path="url(#c3)"><image xlink:href="../postcard-a.png" x="35" y="428" width="330" height="320" preserveAspectRatio="xMidYMid slice" transform="rotate(-7 200 590)" filter="url(#paper)"/></g>
  <g clip-path="url(#c4)"><image xlink:href="../postcard-a.png" x="428" y="428" width="344" height="270" preserveAspectRatio="xMidYMid slice" transform="rotate(5 600 560)" filter="url(#paper)"/></g>
  <g clip-path="url(#c5)"><image xlink:href="../postcard-a.png" x="850" y="470" width="300" height="250" preserveAspectRatio="xMidYMid slice" filter="url(#paper)"/></g>
